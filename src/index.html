      <main style="max-width: 40rem; margin: 10vh auto; padding: 1.5rem; font: 16px/1.5 Georgia, serif; color: #f2e6c4; background: #131110">
        <h1>Congulatio — Character &amp; Dialogue Forge for RPG Worlds</h1>
        <p>
          Congulatio is a free, offline-first web app for game designers and writers. It runs entirely in your browser and
          needs JavaScript turned on.
        </p>
        <h2>What you can do</h2>
        <ul>
          <li>Summon coherent random characters with names, traits and 8-bit portraits.</li>
          <li>Sculpt low-poly 3D builds and play Mixamo animations.</li>
          <li>Write branching dialogue with tone variants and world impact.</li>
          <li>Plan daily routines, record interactions and map relations.</li>
          <li>Simulate how characters with different motives play a scene out.</li>
          <li>Install it as an app, work offline, and optionally sync with an account.</li>
        </ul>
        <p><a href="https://github.com/Grano22/congulatio" style="color: #e2c25c">Source code and documentation on GitHub</a></p>
