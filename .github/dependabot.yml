version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      firebase:
        patterns: ["firebase", "@firebase/*"]
      dev-tooling:
        dependency-type: development
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
