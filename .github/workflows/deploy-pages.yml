name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use the npm version from package.json
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: npm ci

      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm run test:ci

      - name: Write Firebase settings from GitHub secrets
        env:
          FIREBASE_STAGE: ${{ secrets.FIREBASE_STAGE || vars.FIREBASE_STAGE || 'production' }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID || vars.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_EMULATORS: 'false'
          FIREBASE_ENV_FILE: .env.ci-none
          FIREBASE_KEEP_EXISTING: 'false'
        run: node scripts/firebase-config.mjs

      - name: Build for GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE_HREF="/"; else BASE_HREF="/$REPO/"; fi
          echo "Building with base href $BASE_HREF"
          npx ng build --base-href "$BASE_HREF"

      - name: Point canonical links, sitemap and security.txt at this site
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then SITE_URL="https://$REPO/"; BASE_HREF="/"; else SITE_URL="https://$OWNER.github.io/$REPO/"; BASE_HREF="/$REPO/"; fi
          if [[ "$SITE_URL" != "https://grano22.github.io/congulatio/" ]]; then
            grep -rl --include='*.html' --include='*.txt' --include='*.xml' 'https://grano22.github.io/congulatio/' dist/congulatio/browser \
              | xargs -r sed -i "s#https://grano22.github.io/congulatio/#$SITE_URL#g"
            npx ngsw-config dist/congulatio/browser ngsw-config.json "$BASE_HREF"
          fi
          echo "Site URL: $SITE_URL"

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/congulatio/browser/index.html dist/congulatio/browser/404.html
          touch dist/congulatio/browser/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/congulatio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
