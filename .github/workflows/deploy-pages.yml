name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use the npm version from package.json
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Build for GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE_HREF="/"; else BASE_HREF="/$REPO/"; fi
          echo "Building with base href $BASE_HREF"
          npx ng build --base-href "$BASE_HREF"

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/congulatio/browser/index.html dist/congulatio/browser/404.html
          touch dist/congulatio/browser/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/congulatio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
